<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>活动建议</title>
  </head>
  <body>
    <h1 id="advice-display">正在加载...</h1>
    <button id="new-advice-btn" type="button">获取新建议</button>

    <script>
      const adviceDisplay = document.getElementById('advice-display');
      const adviceButton = document.getElementById('new-advice-btn');

      async function fetchAndDisplayAdvice() {
        try {
          adviceDisplay.textContent = '正在加载...';
          const response = await fetch('https://www.boredapi.com/api/activity/');
          if (!response.ok) {
            throw new Error('Network error');
          }

          const data = await response.json();
          adviceDisplay.textContent = data.activity || '获取失败';
        } catch (error) {
          adviceDisplay.textContent = '获取失败';
        }
      }

      adviceButton.addEventListener('click', fetchAndDisplayAdvice);
      window.addEventListener('DOMContentLoaded', fetchAndDisplayAdvice);
    </script>
  </body>
</html>
